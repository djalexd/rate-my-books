[project]
name = "rate-my-books"
version = "0.1.0"
description = "Rates the books in a Dropbox folder and recommends what to read next from an Obsidian read-list."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "dropbox>=12.0",
    "numpy>=2.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "requests>=2.32",
]

[project.scripts]
rate-my-books = "rate_my_books.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
    "types-pyyaml",
    "types-requests",
]

[build-system]
requires = ["uv_build>=0.7.8,<0.8"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["dropbox", "dropbox.*"]
ignore_missing_imports = true
